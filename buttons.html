<!DOCTYPE html>
<html>
  <head>
    <style>
      .uber {
       background-color: black;
       color: white;
       width: 110px;
       height: 40px;
       font-weight: bold;
       font-size: 12px;
       border-style: solid;
       margin-bottom: 8px;
      }

      .amazon {
        background-color: rgb(255, 216, 20);
        border-style: none;
        width: 135px;
        height: 30px;
        margin-right: 8px;
        border-radius: 20px;
        font-size: 14px;
        cursor: pointer;
        margin-bottom: 8px;
      }

      .github {
        background-color: rgb(46, 164, 79);
        border-style: none;
        color: white;
        font-weight: bold;
        border-radius: 7px;
        font-size: 15px;
        cursor: pointer;
        height: 40px;
        width: 108px;
        margin-right: 8px;
        margin-bottom: 8px;
      }

      .apply_linkedin {
        background-color: rgb(10, 102, 194);
        color: white;
        font-weight: bold;
        border-style: none;
        border-radius: 21px;
        width: 208px;
        height: 40px;
        cursor: pointer;
        margin-right: 8px;
        margin-bottom: 8px;
      }

      .save_linkedin {
        background-color: white;
        color: rgb(10, 102, 194);
        border-color: rgb(10, 102, 194);
        border-width: 1px;
        font-weight: bold;
        font-size: 15px;
        border-radius: 21px;
        border-style: solid;
        height: 40px;
        width: 80px;
        margin-right: 8px;
        margin-bottom: 8px;
        cursor: pointer;
      }

      .getstarted_bootstrap {
        background-color: rgb(121, 82, 179);
        border: none;
        border-style: none;
        color: white;
        border-radius: 5px;
        font-weight: bold;
        font-size: 14px;
        width: 110px;
        height: 40px;
        margin-right: 8px;
        cursor: pointer;
        margin-bottom: 8px;
      }
      .download_bootstrap {
        background-color: white;
        border-width: 1px;
        border-color: rgb(108, 117, 125);
        border-style: solid;
        color: rgb(108, 117, 125);
        border-radius: 5px;
        font-weight: bold;
        font-size: 14px;
        width: 110px;
        height: 40px;
        cursor: pointer;
        margin-bottom: 8px;
      }
    </style>
  </head>
  <body>
    <button class="uber">
      Request now
    </button>
    <p><--- Uber Button</p>
    <br>
    <button class="amazon">
      Add to Cart
    </button>
    <p><--- Amazon Button</p>
    <br>
    <button class="github">
      Sign up
    </button>
    <p><--- Github Button</p>
    <br>
    <button class="apply_linkedin">Apply on company website</button>
    <p><--- Linked in apply button</p>
    <button class="save_linkedin">Save</button>
    <p><--- Linked in save button</p>
    <br>
    <button class="getstarted_bootstrap">Get started</button>
    <p><--- Bootstrap get started button</p>
    <button class="download_bootstrap">Download</button>
    <p><--- Bootstrap Download button</p>

  </body>
</html>
